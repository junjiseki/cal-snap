name: Meal Reminder Cron

on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch:

concurrency:
  group: meal-reminders-cron
  cancel-in-progress: false

jobs:
  send-meal-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call meal reminder endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL}" ]; then
            echo "APP_URL secret is required." >&2
            exit 1
          fi

          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET secret is required." >&2
            exit 1
          fi

          response_file="$(mktemp)"
          status_code="$(
            curl --show-error --silent \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              --retry 2 \
              --retry-all-errors \
              --retry-delay 5 \
              --max-time 30 \
              --connect-timeout 10 \
              --request POST \
              --user-agent "cal-snap-meal-reminder-cron/1.0" \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL%/}/api/cron/meal-reminders"
          )"

          cat "${response_file}"
          echo

          if [ "${status_code}" -lt 200 ] || [ "${status_code}" -ge 300 ]; then
            echo "Meal reminder cron failed with HTTP ${status_code}." >&2
            exit 1
          fi
